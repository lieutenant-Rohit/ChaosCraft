spring:
  application:
    name: demo-app
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8085
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 200
    accept-count: 100
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: demo-app
