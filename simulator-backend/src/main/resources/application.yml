spring:
  application:
    name: incident-simulator
  datasource:
    url: jdbc:h2:mem:simulator
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8090
logging:
  level:
    com.simulator: DEBUG
